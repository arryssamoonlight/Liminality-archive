<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Shooter</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #c8c0aa;
    color: white;
    font-family: monospace;

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 100vh;
    padding: 20px;
}

h1 {
    margin: 5px 0;
}

#info {
    margin: 10px;
    font-size: 18px;
}

#game {
    border: 4px solid white;
    background: #c8c0aa;
    cursor: crosshair;
}

#message {
    margin-top: 10px;
    min-height: 24px;
}

#controls {
    margin-top: 10px;
    opacity: 0.8;
}

button {
    margin-top: 10px;
    padding: 8px 18px;

    background: #c8c0aa;
    color: white;

    border: 1px solid white;

    font-family: monospace;
    cursor: pointer;
}

button:hover {
    background: #b5aa91;
}

a {
    margin-top: 12px;
    color: #ffffff;
}

</style>
<link rel="icon" type="image/png" href="logo.png">
</head>


<body>

<h1>SHOOTER</h1>

<div id="info">

    HEALTH:
    <span id="health">100</span>

    |

    SCORE:
    <span id="score">0</span>

    |

    TIME:
    <span id="time">60</span>

</div>


<canvas id="game" width="700" height="500"></canvas>


<div id="message">
    SURVIVE FOR 60 SECONDS.
</div>


<div id="controls">
    WASD / Arrow Keys = Move | Mouse = Aim | Click = Shoot
</div>


<button onclick="restartGame()">RESTART GAME</button>

<br>

<a href="Menu.html">Back to Home</a>


<script>


// ============================================
// GAME SETUP
// ============================================

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

const healthText =
    document.getElementById("health");

const scoreText =
    document.getElementById("score");

const timeText =
    document.getElementById("time");

const message =
    document.getElementById("message");


// ============================================
// PLAYER
// ============================================

let player;

let health;

let score;

let gameRunning;

let timeLeft;


// ============================================
// CONTROLS
// ============================================

let keys = {};

let mouse = {
    x: 350,
    y: 250
};


// ============================================
// ENTITIES
// ============================================

let entities = [];


// ============================================
// BULLETS
// ============================================

let bullets = [];


// ============================================
// KEYBOARD
// ============================================

document.addEventListener("keydown", function(event) {

    keys[event.key.toLowerCase()] = true;

});


document.addEventListener("keyup", function(event) {

    keys[event.key.toLowerCase()] = false;

});


// ============================================
// MOUSE
// ============================================

canvas.addEventListener("mousemove", function(event) {

    const rect = canvas.getBoundingClientRect();

    mouse.x =
        event.clientX - rect.left;

    mouse.y =
        event.clientY - rect.top;

});


canvas.addEventListener("mousedown", function() {

    if (gameRunning) {
        shoot();
    }

});


// ============================================
// START GAME
// ============================================

function restartGame() {

    player = {
        x: canvas.width / 2,
        y: canvas.height / 2,

        size: 16,

        speed: 4
    };


    health = 100;

    score = 0;

    timeLeft = 60;

    entities = [];

    bullets = [];

    gameRunning = true;


    message.textContent =
        "SURVIVE FOR 60 SECONDS.";


    updateDisplay();

}


// ============================================
// UPDATE DISPLAY
// ============================================

function updateDisplay() {

    healthText.textContent =
        Math.max(0, Math.floor(health));

    scoreText.textContent =
        score;

    timeText.textContent =
        Math.max(0, Math.ceil(timeLeft));

}


// ============================================
// SHOOT
// ============================================

function shoot() {

    const dx =
        mouse.x - player.x;

    const dy =
        mouse.y - player.y;

    const distance =
        Math.sqrt(dx * dx + dy * dy);


    if (distance === 0) {
        return;
    }


    bullets.push({

        x: player.x,

        y: player.y,

        dx: dx / distance,

        dy: dy / distance,

        speed: 9,

        size: 4

    });

}


// ============================================
// CREATE ENTITY
// ============================================

function spawnEntity() {

    let side =
        Math.floor(Math.random() * 4);

    let x;
    let y;


    if (side === 0) {

        x = Math.random() * canvas.width;
        y = -30;

    }

    else if (side === 1) {

        x = canvas.width + 30;
        y = Math.random() * canvas.height;

    }

    else if (side === 2) {

        x = Math.random() * canvas.width;
        y = canvas.height + 30;

    }

    else {

        x = -30;
        y = Math.random() * canvas.height;

    }


    // Only three entity types

    let type =
        Math.floor(Math.random() * 3);


    let entity;


    // ----------------------------------------
    // NORMAL ENTITY
    // ----------------------------------------

    if (type === 0) {

        entity = {

            x: x,

            y: y,

            size: 18,

            speed: 1.3,

            health: 1,

            type: "wanderer"

        };

    }


    // ----------------------------------------
    // FAST ENTITY
    // ----------------------------------------

    else if (type === 1) {

        entity = {

            x: x,

            y: y,

            size: 12,

            speed: 2.4,

            health: 1,

            type: "runner"

        };

    }


    // ----------------------------------------
    // LARGE ENTITY
    // ----------------------------------------

    else {

        entity = {

            x: x,

            y: y,

            size: 28,

            speed: 0.8,

            health: 3,

            type: "large"

        };

    }


    entities.push(entity);

}


// ============================================
// MOVE PLAYER
// ============================================

function updatePlayer() {

    let dx = 0;
    let dy = 0;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        dy -= 1;
    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        dy += 1;
    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        dx -= 1;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        dx += 1;
    }


    if (dx !== 0 || dy !== 0) {

        let distance =
            Math.sqrt(dx * dx + dy * dy);

        dx /= distance;
        dy /= distance;

    }


    player.x +=
        dx * player.speed;

    player.y +=
        dy * player.speed;


    // Keep player inside screen

    player.x =
        Math.max(
            player.size,
            Math.min(
                canvas.width - player.size,
                player.x
            )
        );


    player.y =
        Math.max(
            player.size,
            Math.min(
                canvas.height - player.size,
                player.y
            )
        );

}


// ============================================
// UPDATE BULLETS
// ============================================

function updateBullets() {

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        let bullet =
            bullets[i];


        bullet.x +=
            bullet.dx * bullet.speed;

        bullet.y +=
            bullet.dy * bullet.speed;


        if (
            bullet.x < 0 ||
            bullet.x > canvas.width ||
            bullet.y < 0 ||
            bullet.y > canvas.height
        ) {

            bullets.splice(i, 1);

        }

    }

}


// ============================================
// UPDATE ENTITIES
// ============================================

function updateEntities() {

    for (
        let i = entities.length - 1;
        i >= 0;
        i--
    ) {

        let entity =
            entities[i];


        const dx =
            player.x - entity.x;

        const dy =
            player.y - entity.y;

        const distance =
            Math.sqrt(dx * dx + dy * dy);


        if (distance > 0) {

            entity.x +=
                (dx / distance) *
                entity.speed;

            entity.y +=
                (dy / distance) *
                entity.speed;

        }


        // Entity touches player

        if (
            distance <
            entity.size + player.size
        ) {

            health -= 0.5;


            if (distance > 0) {

                entity.x -=
                    (dx / distance) * 10;

                entity.y -=
                    (dy / distance) * 10;

            }

        }

    }

}


// ============================================
// BULLET COLLISIONS
// ============================================

function checkBulletCollisions() {

    for (
        let b = bullets.length - 1;
        b >= 0;
        b--
    ) {

        let bullet =
            bullets[b];


        for (
            let e = entities.length - 1;
            e >= 0;
            e--
        ) {

            let entity =
                entities[e];


            const dx =
                bullet.x - entity.x;

            const dy =
                bullet.y - entity.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);


            if (
                distance <
                bullet.size + entity.size
            ) {

                entity.health -= 1;

                bullets.splice(b, 1);


                if (entity.health <= 0) {

                    entities.splice(e, 1);

                    score += 10;

                }


                break;

            }

        }

    }

}


// ============================================
// DRAW GAME
// ============================================

function draw() {

    // Beige background

    ctx.fillStyle = "#c8c0aa";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Subtle grid

    ctx.strokeStyle = "#b5aa91";

    ctx.lineWidth = 1;


    for (
        let x = 0;
        x < canvas.width;
        x += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(x, 0);

        ctx.lineTo(
            x,
            canvas.height
        );

        ctx.stroke();

    }


    for (
        let y = 0;
        y < canvas.height;
        y += 40
    ) {

        ctx.beginPath();

        ctx.moveTo(0, y);

        ctx.lineTo(
            canvas.width,
            y
        );

        ctx.stroke();

    }


    // Border

    ctx.strokeStyle = "#ffffff";

    ctx.strokeRect(
        10,
        10,
        canvas.width - 20,
        canvas.height - 20
    );


    // ----------------------------------------
    // BULLETS
    // ----------------------------------------

    ctx.fillStyle = "#ffffff";


    for (let bullet of bullets) {

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    // ----------------------------------------
    // ENTITIES
    // ----------------------------------------

    for (let entity of entities) {

        ctx.fillStyle = "#ffffff";


        ctx.beginPath();

        ctx.arc(
            entity.x,
            entity.y,
            entity.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // Health indicator for large entities

        if (entity.health > 1) {

            ctx.fillStyle = "#ffffff";

            ctx.fillRect(
                entity.x - 15,
                entity.y - entity.size - 8,
                entity.health * 10,
                3
            );

        }

    }


    // ----------------------------------------
    // PLAYER
    // ----------------------------------------

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.size,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // ----------------------------------------
    // AIM LINE
    // ----------------------------------------

    ctx.strokeStyle = "#ffffff";

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        mouse.x,
        mouse.y
    );

    ctx.stroke();

}


// ============================================
// GAME LOOP
// ============================================

let lastTime = performance.now();

let spawnTimer = 0;


function gameLoop(currentTime) {

    const delta =
        (currentTime - lastTime) / 1000;

    lastTime = currentTime;


    if (gameRunning) {

        timeLeft -= delta;

        spawnTimer += delta;


        // Fewer entities:
        // starts around every 6 seconds
        // and gradually gets faster

        let spawnDelay =
            Math.max(
                3,
                6 - (60 - timeLeft) / 30
            );


        if (spawnTimer >= spawnDelay) {

            spawnEntity();

            spawnTimer = 0;

        }


        updatePlayer();

        updateBullets();

        updateEntities();

        checkBulletCollisions();


        if (health <= 0) {

            gameOver();

        }


        if (timeLeft <= 0) {

            winGame();

        }


        updateDisplay();

    }


    draw();


    requestAnimationFrame(gameLoop);

}


// ============================================
// GAME OVER
// ============================================

function gameOver() {

    gameRunning = false;

    message.textContent =
        "YOU DID NOT SURVIVE.";

}


// ============================================
// WIN
// ============================================

function winGame() {

    gameRunning = false;

    message.textContent =
        "60 SECONDS SURVIVED. ARCHIVE EXIT FOUND.";

}


// ============================================
// START
// ============================================

restartGame();

requestAnimationFrame(gameLoop);

</script>

</body>

</html>
