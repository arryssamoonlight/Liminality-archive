<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Maze</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    h1 {
        margin: 5px 0;
    }

    #info {
        margin: 8px;
        text-align: center;
    }

    #game {
        border: 4px solid white;
        image-rendering: pixelated;
        max-width: 90vw;
        max-height: 70vh;
    }

    #message {
        margin-top: 12px;
        min-height: 24px;
        font-size: 16px;
    }

    button {
        margin-top: 10px;
        padding: 8px 18px;
        background: #222;
        color: white;
        border: 1px solid white;
        font-family: monospace;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    #controls {
        margin-top: 10px;
        opacity: 0.8;
    }
</style>
<link rel="icon" type="image/png" href="logo.png">
</head>

<body>

<h1>LIMINALITY ARCHIVE</h1>

<div id="info">
    LEVEL <span id="levelNumber">1</span> / 10
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="message">
    Find the exit.
</div>

<div id="controls">
    WASD / Arrow Keys = Move | R = Restart
</div>

<button onclick="restartLevel()">RESTART LEVEL</button><br>
<a href="menu.html" style="color: #ffffff;">Back to Home</a>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const levelText = document.getElementById("levelNumber");
const message = document.getElementById("message");


// ============================================
// LEVEL SETTINGS
// ============================================

const levels = [

    {
        wall: "#5c4b32",
        floor: "#d6c48a",
        player: "#ffffff",
        exit: "#66ff66",
        name: "The Yellow Halls"
    },

    {
        wall: "#183b56",
        floor: "#4b86a8",
        player: "#ffffff",
        exit: "#72ffff",
        name: "The Flooded Hall"
    },

    {
        wall: "#3b164f",
        floor: "#8d5ca8",
        player: "#ffffff",
        exit: "#ff72ff",
        name: "The Violet Rooms"
    },

    {
        wall: "#4a1010",
        floor: "#9c3535",
        player: "#ffffff",
        exit: "#ffcc66",
        name: "The Red Corridor"
    },

    {
        wall: "#123d25",
        floor: "#4c8f62",
        player: "#ffffff",
        exit: "#aaffaa",
        name: "The Green Halls"
    },

    {
        wall: "#222222",
        floor: "#555555",
        player: "#ffffff",
        exit: "#ffff66",
        name: "The Dead Level"
    },

    {
        wall: "#302010",
        floor: "#9b7048",
        player: "#ffffff",
        exit: "#ff9933",
        name: "The Rusted Rooms"
    },

    {
        wall: "#162d3d",
        floor: "#39748f",
        player: "#ffffff",
        exit: "#66ccff",
        name: "The Cold Level"
    },

    {
        wall: "#40152d",
        floor: "#9b416e",
        player: "#ffffff",
        exit: "#ff99cc",
        name: "The Pink Halls"
    },

    {
        wall: "#080808",
        floor: "#171717",
        player: "#ffffff",
        exit: "#ff0000",
        name: "The Final Level"
    }

];


// ============================================
// MAZE SETTINGS
// ============================================

// Number of cells across/down.
// Odd numbers work best for this maze generator.

const SIZE = 21;

const cellSize = canvas.width / SIZE;

let maze;
let player;
let exit;
let currentLevel = 0;


// ============================================
// CREATE MAZE
// ============================================

function createMaze() {

    // Fill everything with walls

    maze = [];

    for (let y = 0; y < SIZE; y++) {

        maze[y] = [];

        for (let x = 0; x < SIZE; x++) {
            maze[y][x] = 1;
        }
    }


    // Maze generation using recursive backtracking

    function carve(x, y) {

        maze[y][x] = 0;

        let directions = [
            [2, 0],
            [-2, 0],
            [0, 2],
            [0, -2]
        ];

        // Shuffle directions

        directions.sort(() => Math.random() - 0.5);

        for (let direction of directions) {

            let nx = x + direction[0];
            let ny = y + direction[1];

            if (
                nx > 0 &&
                nx < SIZE - 1 &&
                ny > 0 &&
                ny < SIZE - 1 &&
                maze[ny][nx] === 1
            ) {

                // Remove wall between cells

                maze[
                    y + direction[1] / 2
                ][
                    x + direction[0] / 2
                ] = 0;

                carve(nx, ny);
            }
        }
    }


    carve(1, 1);


    // Player starts here

    player = {
        x: 1,
        y: 1
    };


    // Exit is in the opposite corner

    exit = {
        x: SIZE - 2,
        y: SIZE - 2
    };

    maze[exit.y][exit.x] = 0;
}


// ============================================
// DRAW EVERYTHING
// ============================================

function draw() {

    const colors = levels[currentLevel];

    // Background

    ctx.fillStyle = colors.wall;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Draw maze

    for (let y = 0; y < SIZE; y++) {

        for (let x = 0; x < SIZE; x++) {

            if (maze[y][x] === 0) {

                ctx.fillStyle = colors.floor;

                ctx.fillRect(
                    x * cellSize,
                    y * cellSize,
                    cellSize,
                    cellSize
                );

            }
        }
    }


    // Exit

    ctx.fillStyle = colors.exit;

    ctx.fillRect(
        exit.x * cellSize + cellSize * 0.2,
        exit.y * cellSize + cellSize * 0.2,
        cellSize * 0.6,
        cellSize * 0.6
    );


    // Player

    ctx.fillStyle = colors.player;

    ctx.fillRect(
        player.x * cellSize + cellSize * 0.2,
        player.y * cellSize + cellSize * 0.2,
        cellSize * 0.6,
        cellSize * 0.6
    );


    // Player glow

    ctx.shadowColor = colors.player;
    ctx.shadowBlur = 10;

    ctx.fillRect(
        player.x * cellSize + cellSize * 0.3,
        player.y * cellSize + cellSize * 0.3,
        cellSize * 0.4,
        cellSize * 0.4
    );

    ctx.shadowBlur = 0;
}


// ============================================
// MOVEMENT
// ============================================

function movePlayer(dx, dy) {

    let newX = player.x + dx;
    let newY = player.y + dy;


    // Don't walk through walls

    if (
        newX < 0 ||
        newX >= SIZE ||
        newY < 0 ||
        newY >= SIZE
    ) {
        return;
    }

    if (maze[newY][newX] === 1) {
        return;
    }


    player.x = newX;
    player.y = newY;


    checkExit();

    draw();
}


// ============================================
// CHECK EXIT
// ============================================

function checkExit() {

    if (
        player.x === exit.x &&
        player.y === exit.y
    ) {

        if (currentLevel < levels.length - 1) {

            message.textContent =
                "You found the exit... entering the next level.";

            setTimeout(() => {

                currentLevel++;

                startLevel();

            }, 700);

        } else {

            message.textContent =
                "YOU ESCAPED THE MAZE.";

            alert(
                "ARCHIVE MESSAGE:\n\n" +
                "You escaped all 10 levels."
            );
        }
    }
}


// ============================================
// START LEVEL
// ============================================

function startLevel() {

    createMaze();

    levelText.textContent = currentLevel + 1;

    message.textContent =
        levels[currentLevel].name +
        " — Find the exit.";

    document.body.style.background =
        levels[currentLevel].wall;

    draw();
}


// ============================================
// RESTART
// ============================================

function restartLevel() {

    startLevel();
}


// ============================================
// KEYBOARD CONTROLS
// ============================================

document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowUp" ||
        event.key.toLowerCase() === "w"
    ) {
        event.preventDefault();
        movePlayer(0, -1);
    }

    else if (
        event.key === "ArrowDown" ||
        event.key.toLowerCase() === "s"
    ) {
        event.preventDefault();
        movePlayer(0, 1);
    }

    else if (
        event.key === "ArrowLeft" ||
        event.key.toLowerCase() === "a"
    ) {
        event.preventDefault();
        movePlayer(-1, 0);
    }

    else if (
        event.key === "ArrowRight" ||
        event.key.toLowerCase() === "d"
    ) {
        event.preventDefault();
        movePlayer(1, 0);
    }

    else if (
        event.key.toLowerCase() === "r"
    ) {
        restartLevel();
    }

});


// ============================================
// START GAME
// ============================================

startLevel();

</script>

</body>
</html>
