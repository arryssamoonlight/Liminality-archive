<!DOCTYPE html>
<html>
<head>
    <title>Obby</title>

    <style>
        body {
            margin: 0;
            background-color: #c8c0aa;
            color: #ffffff;
            font-family: monospace;
            text-align: center;
        }

        canvas {
            background-color: #c8c0aa;
            border: 2px solid #ffffff;
            display: block;
            margin: 20px auto;
        }

        button, a {
            font-family: monospace;
            color: #ffffff;
        }

        button {
            background-color: #c8c0aa;
            border: 1px solid #ffffff;
            padding: 8px 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b5aa91;
        }

        #health {
            margin: 10px;
        }

        #message {
            height: 20px;
        }
    </style>
<link rel="icon" type="image/png" href="logo.png">
</head>

<body>

<h1>OBBY</h1>

<p>A/D or Arrow Keys = Move | SPACE/W/UP = Jump</p>

<div id="health">HEALTH: 100</div>
<div id="message"></div>

<canvas id="game" width="900" height="450"></canvas>

<button onclick="restartStage()">RESTART STAGE</button>
<button onclick="restartGame()">RESTART GAME</button>

<br><br>

<a href="Menu.html">Back to Home</a>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};

document.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key === "ArrowUp" ||
        e.key.toLowerCase() === "w"
    ) {
        e.preventDefault();

        if (player.grounded) {
            player.velocityY = -11;
            player.grounded = false;
        }
    }

});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});


let stage = 1;

let player = {
    x: 40,
    y: 330,
    width: 25,
    height: 35,
    velocityX: 0,
    velocityY: 0,
    grounded: false,
    health: 100,
    invincible: 0
};


let platforms = [];
let killbricks = [];
let damageBlocks = [];


/*
    INVISIBLE CHECKPOINT
    It still works, but NOTHING is drawn.
*/

let checkpoint = {
    x: 620,
    y: 190,
    width: 8,
    height: 30,
    reached: false
};


let exit = {
    x: 780,
    y: 120,
    width: 35,
    height: 60
};


function loadStage() {

    platforms = [];
    killbricks = [];
    damageBlocks = [];

    checkpoint.reached = false;

    /*
        STAGE 1
    */

    if (stage === 1) {

        platforms.push(
            {x: 0, y: 380, width: 180, height: 20},
            {x: 230, y: 330, width: 120, height: 20},
            {x: 400, y: 280, width: 120, height: 20},
            {x: 570, y: 230, width: 120, height: 20}
        );
    }


    /*
        STAGE 2
    */

    if (stage === 2) {

        platforms.push(
            {x: 0, y: 380, width: 150, height: 20},
            {x: 200, y: 320, width: 110, height: 20},
            {x: 350, y: 260, width: 110, height: 20},
            {x: 510, y: 200, width: 110, height: 20},
            {x: 680, y: 150, width: 120, height: 20}
        );
    }


    /*
        STAGE 3
    */

    if (stage === 3) {

        platforms.push(
            {x: 0, y: 380, width: 170, height: 20},
            {x: 220, y: 330, width: 110, height: 20},
            {x: 370, y: 280, width: 110, height: 20},
            {x: 520, y: 330, width: 120, height: 20},
            {x: 700, y: 250, width: 120, height: 20}
        );

        damageBlocks.push({
            x: 490,
            y: 310,
            width: 40,
            height: 20
        });
    }


    /*
        STAGE 4
    */

    if (stage === 4) {

        platforms.push(
            {x: 0, y: 380, width: 170, height: 20},
            {x: 220, y: 340, width: 120, height: 20},
            {x: 400, y: 300, width: 100, height: 20},
            {x: 520, y: 350, width: 110, height: 20},
            {x: 700, y: 250, width: 120, height: 20}
        );

        killbricks.push({
            x: 535,
            y: 330,
            width: 45,
            height: 20
        });
    }


    /*
        STAGE 5
    */

    if (stage === 5) {

        platforms.push(
            {x: 0, y: 380, width: 160, height: 20},
            {x: 210, y: 330, width: 100, height: 20},
            {x: 350, y: 250, width: 100, height: 20},
            {x: 500, y: 300, width: 110, height: 20},
            {x: 680, y: 200, width: 120, height: 20}
        );

        killbricks.push({
            x: 245,
            y: 310,
            width: 40,
            height: 20
        });

        damageBlocks.push({
            x: 390,
            y: 230,
            width: 40,
            height: 20
        });
    }


    /*
        STAGE 6
    */

    if (stage === 6) {

        platforms.push(
            {x: 0, y: 380, width: 150, height: 20},
            {x: 200, y: 330, width: 110, height: 20},
            {x: 350, y: 270, width: 100, height: 20},
            {x: 470, y: 210, width: 100, height: 20},
            {x: 650, y: 160, width: 130, height: 20}
        );

        killbricks.push({
            x: 475,
            y: 190,
            width: 40,
            height: 20
        });
    }


    /*
        STAGE 7
    */

    if (stage === 7) {

        platforms.push(
            {x: 0, y: 380, width: 150, height: 20},
            {x: 190, y: 350, width: 100, height: 20},
            {x: 330, y: 330, width: 100, height: 20},
            {x: 460, y: 280, width: 110, height: 20},
            {x: 650, y: 220, width: 130, height: 20}
        );

        killbricks.push({
            x: 480,
            y: 260,
            width: 40,
            height: 20
        });

        damageBlocks.push({
            x: 350,
            y: 310,
            width: 35,
            height: 20
        });
    }


    /*
        STAGE 8
    */

    if (stage === 8) {

        platforms.push(
            {x: 0, y: 380, width: 150, height: 20},
            {x: 190, y: 350, width: 100, height: 20},
            {x: 320, y: 330, width: 100, height: 20},
            {x: 450, y: 350, width: 100, height: 20},
            {x: 600, y: 300, width: 120, height: 20},
            {x: 760, y: 220, width: 100, height: 20}
        );

        killbricks.push({
            x: 470,
            y: 330,
            width: 40,
            height: 20
        });
    }


    /*
        STAGE 9
    */

    if (stage === 9) {

        platforms.push(
            {x: 0, y: 380, width: 150, height: 20},
            {x: 190, y: 330, width: 100, height: 20},
            {x: 320, y: 250, width: 100, height: 20},
            {x: 420, y: 220, width: 80, height: 20},
            {x: 520, y: 300, width: 100, height: 20},
            {x: 680, y: 200, width: 140, height: 20}
        );

        killbricks.push({
            x: 425,
            y: 200,
            width: 35,
            height: 20
        });

        damageBlocks.push({
            x: 535,
            y: 280,
            width: 35,
            height: 20
        });
    }


    /*
        STAGE 10
    */

    if (stage === 10) {

        platforms.push(
            {x: 0, y: 380, width: 180, height: 20},
            {x: 230, y: 330, width: 120, height: 20},
            {x: 400, y: 270, width: 100, height: 20},
            {x: 520, y: 220, width: 100, height: 20},
            {x: 680, y: 170, width: 100, height: 20},
            {x: 800, y: 120, width: 100, height: 20}
        );

        killbricks.push({
            x: 430,
            y: 250,
            width: 35,
            height: 20
        });

        damageBlocks.push({
            x: 540,
            y: 200,
            width: 35,
            height: 20
        });

        /*
            NO VERTICAL BRICK.
            NO CHECKPOINT POLE.
            NO VERTICAL WALL.
        */
    }


    player.x = 40;
    player.y = 330;
    player.velocityX = 0;
    player.velocityY = 0;
    player.grounded = false;
    player.health = 100;
    player.invincible = 0;

    updateHealth();
}


function updateHealth() {

    document.getElementById("health").textContent =
        "HEALTH: " + player.health;
}


function restartStage() {

    loadStage();

}


function restartGame() {

    stage = 1;

    document.getElementById("message").textContent = "";

    loadStage();

}


function die() {

    if (checkpoint.reached) {

        player.x = checkpoint.x - 40;
        player.y = checkpoint.y - player.height;

    } else {

        player.x = 40;
        player.y = 330;

    }

    player.velocityX = 0;
    player.velocityY = 0;

    player.health = 100;

    updateHealth();
}


function damage(amount) {

    if (player.invincible > 0) return;

    player.health -= amount;

    player.invincible = 45;

    updateHealth();

    if (player.health <= 0) {
        die();
    }
}


function touching(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}


function update() {

    player.velocityX = 0;

    if (keys["a"] || keys["arrowleft"]) {
        player.velocityX = -4;
    }

    if (keys["d"] || keys["arrowright"]) {
        player.velocityX = 4;
    }


    let oldX = player.x;

    player.x += player.velocityX;


    /*
        GRAVITY
    */

    player.velocityY += 0.5;

    if (player.velocityY > 12) {
        player.velocityY = 12;
    }

    player.y += player.velocityY;

    player.grounded = false;


    /*
        PLATFORM COLLISION
    */

    for (let platform of platforms) {

        /*
            Landing on top
        */

        if (
            player.x < platform.x + platform.width &&
            player.x + player.width > platform.x &&
            player.y + player.height >= platform.y &&
            player.y + player.height <= platform.y + platform.height + 5 &&
            player.velocityY >= 0
        ) {

            player.y = platform.y - player.height;

            player.velocityY = 0;

            player.grounded = true;
        }


        /*
            Side collision
        */

        else if (
            player.x < platform.x + platform.width &&
            player.x + player.width > platform.x &&
            player.y < platform.y + platform.height &&
            player.y + player.height > platform.y
        ) {

            if (oldX + player.width <= platform.x) {

                player.x = platform.x - player.width;

            }

            else if (oldX >= platform.x + platform.width) {

                player.x = platform.x + platform.width;

            }
        }
    }


    /*
        SCREEN BOUNDS
    */

    if (player.x < 0) {
        player.x = 0;
    }

    if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
    }


    /*
        INVISIBLE CHECKPOINT
        No visual marker is created.
    */

    if (
        player.x + player.width > checkpoint.x &&
        player.x < checkpoint.x + checkpoint.width &&
        player.y + player.height > checkpoint.y &&
        player.y < checkpoint.y + checkpoint.height
    ) {

        checkpoint.reached = true;

    }


    /*
        KILLBRICKS
    */

    for (let brick of killbricks) {

        if (touching(player, brick)) {

            die();

        }
    }


    /*
        DAMAGE BLOCKS
    */

    for (let block of damageBlocks) {

        if (touching(player, block)) {

            damage(25);

        }
    }


    /*
        FALLING
    */

    if (player.y > canvas.height + 50) {

        die();

    }


    /*
        INVINCIBILITY TIMER
    */

    if (player.invincible > 0) {

        player.invincible--;

    }


    /*
        EXIT
    */

    if (
        player.x + player.width > exit.x &&
        player.y < exit.y + exit.height &&
        player.y + player.height > exit.y
    ) {

        if (stage < 10) {

            stage++;

            loadStage();

        } else {

            document.getElementById("message").textContent =
                "YOU ESCAPED THE ARCHIVE.";

        }
    }
}


function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);


    /*
        GRID
    */

    ctx.strokeStyle = "#b5aa91";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += 40) {

        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();

    }

    for (let y = 0; y < canvas.height; y += 40) {

        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();

    }


    /*
        PLATFORMS
    */

    ctx.fillStyle = "#ffffff";

    for (let platform of platforms) {

        ctx.fillRect(
            platform.x,
            platform.y,
            platform.width,
            platform.height
        );

    }


    /*
        KILLBRICKS
    */

    ctx.fillStyle = "#333333";

    for (let brick of killbricks) {

        ctx.fillRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );

    }


    /*
        DAMAGE BLOCKS
    */

    ctx.fillStyle = "#8f8775";

    for (let block of damageBlocks) {

        ctx.fillRect(
            block.x,
            block.y,
            block.width,
            block.height
        );

    }


    /*
        EXIT
    */

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;

    ctx.strokeRect(
        exit.x,
        exit.y,
        exit.width,
        exit.height
    );


    /*
        PLAYER
    */

    ctx.fillStyle =
        player.invincible > 0
            ? "#8f8775"
            : "#ffffff";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    /*
        STAGE NUMBER
    */

    ctx.fillStyle = "#ffffff";
    ctx.font = "16px monospace";

    ctx.fillText(
        "STAGE " + stage + " / 10",
        20,
        30
    );
}


function gameLoop() {

    update();

    draw();

    requestAnimationFrame(gameLoop);
}


loadStage();

gameLoop();

</script>

</body>
</html>
