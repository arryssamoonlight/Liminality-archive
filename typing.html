<!DOCTYPE html>
<html>

<head>

<title>Typing</title>

<style>

body {
    margin: 0;
    padding: 20px;

    background-color: #c8c0aa;
    color: #ffffff;

    font-family: monospace;
}

h1 {
    margin-bottom: 5px;
}

#terminal {
    width: 90%;
    max-width: 800px;

    height: 420px;

    margin: 20px auto;

    padding: 20px;

    border: 3px solid white;

    background-color: #c8c0aa;

    overflow-y: auto;

    white-space: pre-wrap;
}

#inputArea {
    width: 90%;
    max-width: 800px;

    margin: auto;

    display: flex;
}

#commandInput {
    flex: 1;

    padding: 10px;

    background-color: #c8c0aa;

    color: white;

    border: 2px solid white;

    font-family: monospace;

    outline: none;
}

button {
    margin-left: 8px;

    padding: 10px 16px;

    background-color: #c8c0aa;

    color: white;

    border: 2px solid white;

    font-family: monospace;

    cursor: pointer;
}

button:hover {
    background-color: #b5aa91;
}

#status {
    text-align: center;

    margin-top: 15px;
}

a {
    color: white;
}

</style>
<link rel="icon" type="image/png" href="logo.png">
</head>


<body>


<h1>TYPING</h1>

<p>ARCHIVE TERMINAL // TYPING TEST</p>


<div id="terminal"></div>


<div id="inputArea">

    <input
        id="commandInput"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <button onclick="submitCommand()">
        ENTER
    </button>

</div>


<div id="status">

    COMMAND:
    <span id="commandNumber">1</span>
    /
    <span id="totalCommands">10</span>

    |

    SCORE:
    <span id="score">0</span>

</div>


<p style="text-align: center;">

    <a href="Menu.html">
        Back to Home
    </a>

</p>


<script>


// ==========================================
// TERMINAL SETUP
// ==========================================

const terminal =
    document.getElementById("terminal");

const input =
    document.getElementById("commandInput");

const commandNumber =
    document.getElementById("commandNumber");

const totalCommands =
    document.getElementById("totalCommands");

const scoreText =
    document.getElementById("score");


// ==========================================
// COMMANDS
// ==========================================

const commands = [

    "SCAN_LEVEL_00",

    "OPEN_ARCHIVE_001",

    "ENTITY_SCAN_07",

    "CHECK_LEVEL_STATUS",

    "LOAD_LEVEL_01",

    "SEARCH_EXIT",

    "VERIFY_ENTITY_DATA",

    "OPEN_CLASSIFICATION",

    "RUN_ARCHIVE_CHECK",

    "RETURN_TO_MAIN_ARCHIVE"

];


// ==========================================
// GAME VARIABLES
// ==========================================

let currentCommand = 0;

let score = 0;

let gameOver = false;


// This will contain the commands
// in their randomized order.

let shuffledCommands = [];


// ==========================================
// SHUFFLE COMMANDS
// ==========================================

function shuffleCommands() {

    // Make a copy so the original
    // command list stays unchanged.

    shuffledCommands =
        [...commands];


    // Fisher-Yates shuffle

    for (
        let i = shuffledCommands.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        const temporary =
            shuffledCommands[i];


        shuffledCommands[i] =
            shuffledCommands[j];


        shuffledCommands[j] =
            temporary;

    }

}


// ==========================================
// START
// ==========================================

totalCommands.textContent =
    commands.length;


function startGame() {

    terminal.innerHTML = "";

    currentCommand = 0;

    score = 0;

    gameOver = false;


    // Randomize the command order
    // every time the game starts.

    shuffleCommands();


    scoreText.textContent =
        score;


    showMessage(
        "BACKROOMS ARCHIVE TERMINAL"
    );

    showMessage(
        "CONNECTION: UNSTABLE"
    );

    showMessage(
        "COMMAND SEQUENCE: RANDOMIZED"
    );

    showMessage(
        "TYPE EACH COMMAND EXACTLY."
    );

    showMessage("");


    showNextCommand();

}


// ==========================================
// SHOW MESSAGE
// ==========================================

function showMessage(text) {

    terminal.innerHTML +=
        text + "\n";

    terminal.scrollTop =
        terminal.scrollHeight;

}


// ==========================================
// SHOW COMMAND
// ==========================================

function showNextCommand() {

    if (
        currentCommand >=
        shuffledCommands.length
    ) {

        finishGame();

        return;

    }


    commandNumber.textContent =
        currentCommand + 1;


    showMessage(
        "> TYPE: " +
        shuffledCommands[currentCommand]
    );


    input.value = "";

    input.focus();

}


// ==========================================
// SUBMIT
// ==========================================

function submitCommand() {

    if (gameOver) {
        return;
    }


    const typed =
        input.value.trim();


    const correct =
        shuffledCommands[currentCommand];


    if (typed === correct) {

        score += 100;

        scoreText.textContent =
            score;


        showMessage(
            "> " + typed
        );

        showMessage(
            "STATUS: ACCEPTED"
        );

        showMessage("");


        currentCommand++;


        setTimeout(
            showNextCommand,
            400
        );

    }

    else {

        showMessage(
            "> " + typed
        );

        showMessage(
            "STATUS: ERROR"
        );

        showMessage(
            "INVALID COMMAND."
        );

        showMessage("");


        input.value = "";

        input.focus();

    }

}


// ==========================================
// ENTER KEY
// ==========================================

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            submitCommand();

        }

    }
);


// ==========================================
// FINISH
// ==========================================

function finishGame() {

    gameOver = true;

    showMessage("");

    showMessage(
        "=============================="
    );

    showMessage(
        "ARCHIVE CHECK COMPLETE."
    );

    showMessage(
        "ALL COMMANDS ACCEPTED."
    );

    showMessage(
        "SCORE: " + score
    );

    showMessage(
        "CONNECTION TERMINATED."
    );

    showMessage(
        "=============================="
    );

}


// ==========================================
// START GAME
// ==========================================

startGame();

</script>


</body>

</html>
